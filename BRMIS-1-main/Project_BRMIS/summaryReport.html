<!DOCTYPE html>
<html lang="en">
<link rel="stylesheet" href="summaryReport.css">
<body>
<!-- Filters -->
<div class="summary-filters">
  <div class="filter-row">
    <label>
      From
      <input type="date" id="sumDateFrom">
    </label>
    <label>
      To
      <input type="date" id="sumDateTo">
    </label>
    <label>
      Year
      <select id="sumYear">
        <option value="">All</option>
        <option value="2025">2025</option>
        <option value="2024">2024</option>
        <option value="2023">2023</option>
      </select>
    </label>
    <label>
      Data
      <select id="sumDataType">
        <option value="collected">Collected</option>
        <option value="distributed">Distributed</option>
      </select>
    </label>
    <label>
      Blood Unit
      <select id="sumUnitType">
        <option value="all">All</option>
        <option value="RBC">RBC</option>
        <option value="WBC">WBC</option>
        <option value="Platelets">Platelets</option>
        <option value="Apheresis">Apheresis</option>
      </select>
    </label>
    <button id="sumApply">Apply</button>
    <button id="sumReset" class="ghost">Reset</button>
  </div>
</div>

<!-- Extra Bar Graph -->
<div class="chart-card">
  <div class="chart-title">Chosen Report</div>
  <canvas id="chartChosen"></canvas>
</div>

<!-- Comment box for explanation -->
<div class="comment-box">
  <label for="chartComment">Explanation of Graph:</label>
  <textarea id="chartComment" placeholder="Write your notes or explanation here..."></textarea>
</div>
<!-- Sample Presentation (demo-only) -->
<div class="chart-card">
  <div class="chart-title">Sample Presentation (Demo)</div>
  <div class="filter-row" style="margin-bottom:8px">
    <button id="showSampleGraph">Show Sample Graph</button>
  </div>
  <canvas id="chartSample"></canvas>
</div>
<!-- Export -->
<div class="export-row">
  <button id="sumExportPdf">Export PDF</button>
</div>


<!-- Load Chart.js (already in your file) -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- Add these two for PDF export -->
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</body>
<script src="summaryReport.js"></script>
</html>
